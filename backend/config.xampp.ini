[server]
host = 0.0.0.0
port = 8000
base_url = /api/v1
run_schema_init = true
run_scheduler = true

[database]
host = 127.0.0.1
port = 3306
user = root
password =
name = flight_booking

[security]
session_expire_hours = 24
reset_token_expire_minutes = 60
pbkdf2_iterations = 260000

[rate_limit]
login = 10
window_seconds = 300

[cors]
origins = http://localhost:5173,http://127.0.0.1:5173

[email]
enabled = false
from = noreply@flightbooking.demo

[logging]
level = INFO
file =
