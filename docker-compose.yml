name: flight-reservation

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    container_name: flight-mysql
    restart: unless-stopped
    command:
      - --log-error-verbosity=2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-flight_booking}
      MYSQL_APP_USER: ${DB_USER:-flight_app}
      MYSQL_APP_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_DEV_USER: ${MYSQL_DEV_USER:-flight_dev}
      MYSQL_DEV_PASSWORD: ${MYSQL_DEV_PASSWORD:?MYSQL_DEV_PASSWORD is required}
      MYSQL_MIGRATOR_USER: ${MYSQL_MIGRATOR_USER:-flight_migrator}
      MYSQL_MIGRATOR_PASSWORD: ${MYSQL_MIGRATOR_PASSWORD:?MYSQL_MIGRATOR_PASSWORD is required}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deployment/mysql-init.sh:/docker-entrypoint-initdb.d/10-users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=socket -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [app]
    logging: *default-logging

  flyway:
    image: flyway/flyway:10
    profiles: [tools]
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/database/migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/${DB_NAME:-flight_booking}?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC
      FLYWAY_USER: ${MYSQL_MIGRATOR_USER:-flight_migrator}
      FLYWAY_PASSWORD: ${MYSQL_MIGRATOR_PASSWORD:?MYSQL_MIGRATOR_PASSWORD is required}
      FLYWAY_SCHEMAS: ${DB_NAME:-flight_booking}
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    # `repair` clears any migration previously recorded as failed (MySQL can't roll
    # back DDL, so a failed script leaves a "failed" entry that blocks every future
    # `migrate` until repaired) before actually applying pending migrations. A no-op
    # when nothing is broken, so safe to run on every deploy.
    command: repair migrate
    networks: [app]
    logging: *default-logging

  backend:
    image: flight-backend:${IMAGE_TAG:-latest}
    build: ./backend
    container_name: flight-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_BASE_URL: /api/v1
      RUN_SCHEMA_INIT: "false"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-flight_app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-flight_booking}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://uitair.donotaccess.com,http://localhost:5173,http://127.0.0.1:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [app]
    logging: *default-logging

  frontend:
    image: flight-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_APP_ENV: production
    container_name: flight-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [app, proxy]
    logging: *default-logging

  seed:
    image: flight-backend:${IMAGE_TAG:-latest}
    profiles: [seed]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_MIGRATOR_USER:-flight_migrator}
      DB_PASSWORD: ${MYSQL_MIGRATOR_PASSWORD:?MYSQL_MIGRATOR_PASSWORD is required}
      DB_NAME: ${DB_NAME:-flight_booking}
    command: ["python", "-m", "database.seed"]
    networks: [app]

networks:
  app:
    name: flight-app
  proxy:
    external: true

volumes:
  mysql_data:
    name: flight-mysql-data
